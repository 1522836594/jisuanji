<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博雅未来高中 · 艺术签名明信片</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Liu+Jian+Mao+Cao&family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&family=Zhi+Mang+Xing&family=Long+Cang&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   全局
   ============================================================ */
* { box-sizing:border-box; }
body {
  min-height:100vh; margin:0; font-family:'Noto Serif SC',serif;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(251,191,36,.12) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 100%, rgba(236,72,153,.08) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(139,92,246,.06) 0%, transparent 60%),
    linear-gradient(180deg, #fdfcfa 0%, #f8f4ef 30%, #f2ece3 70%, #ede6dc 100%);
  background-attachment:fixed;
}
body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    url("data:image/svg+xml,%3Csvg width='80' height='80' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='40' cy='40' r='1' fill='rgba(180,160,140,.08)'/%3E%3C/svg%3E"),
    url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='60' cy='60' r='1.5' fill='rgba(160,140,180,.06)'/%3E%3C/svg%3E");
  background-size:80px 80px, 120px 120px;
}

/* ============================================================
   左侧控制台
   ============================================================ */
.control {
  background:linear-gradient(180deg, rgba(255,255,255,.7) 0%, rgba(255,255,255,.45) 100%);
  backdrop-filter:blur(36px); -webkit-backdrop-filter:blur(36px);
  border:1px solid rgba(255,255,255,.7); border-radius:28px;
  padding:36px 32px;
  box-shadow:
    0 12px 48px rgba(0,0,0,.08),
    0 4px 16px rgba(0,0,0,.04),
    inset 0 1px 0 rgba(255,255,255,.8),
    inset 0 -1px 0 rgba(255,255,255,.3);
  width:290px; flex-shrink:0; display:flex; flex-direction:column; gap:22px;
  position:relative; overflow:hidden;
}
.control::before {
  content:''; position:absolute; top:-60px; right:-60px; width:120px; height:120px;
  background:radial-gradient(circle, rgba(249,115,22,.08) 0%, transparent 70%);
  border-radius:50%; pointer-events:none;
}
.control-title {
  font-size:22px; font-weight:800; letter-spacing:.12em; text-align:center;
  background:linear-gradient(135deg,#f97316,#e11d48,#8b5cf6); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  position:relative; z-index:1;
}
.control-subtitle { font-size:11px; text-align:center; color:#a8a29e; letter-spacing:.15em; margin-top:-18px; position:relative; z-index:1; }
.control-divider {
  height:2px; border-radius:1px;
  background:linear-gradient(90deg, transparent, rgba(249,115,22,.2) 20%, rgba(139,92,246,.2) 50%, rgba(236,72,153,.2) 80%, transparent);
}
.control-label {
  font-size:12px; font-weight:700; color:#78716c; margin-bottom:8px; letter-spacing:.08em;
  display:flex; align-items:center; gap:6px;
}
.control-label::before { content:''; width:4px; height:14px; border-radius:2px; background:linear-gradient(180deg,#f97316,#8b5cf6); }
.control-input {
  width:100%; padding:14px 18px; border:2px solid rgba(0,0,0,.06); border-radius:16px;
  font-size:17px; text-align:center; letter-spacing:.15em; outline:none;
  background:rgba(255,255,255,.7); font-family:inherit; transition:all .3s;
}
.control-input:focus {
  border-color:#f97316; background:#fff;
  box-shadow:0 0 0 6px rgba(249,115,22,.06), 0 4px 16px rgba(249,115,22,.1);
}
.control-input::placeholder { color:#d6d3d1; }
.control-hint { font-size:10px; color:#a8a29e; text-align:center; margin-top:6px; letter-spacing:.04em; }

.status-msg { font-size:10px; text-align:center; color:#a8a29e; min-height:16px; letter-spacing:.04em; }

/* 按钮 */
.btn-gen {
  width:100%; padding:15px; border-radius:16px; border:none; font-size:16px; font-weight:700; letter-spacing:.1em;
  cursor:pointer; color:#fff; transition:all .35s;
  background:linear-gradient(135deg,#f97316,#ec4899,#8b5cf6,#06b6d4); background-size:300% 300%;
  animation:gradientShift 5s ease infinite;
  box-shadow:0 8px 28px rgba(249,115,22,.3), 0 2px 8px rgba(249,115,22,.15);
  position:relative; overflow:hidden;
}
.btn-gen::after {
  content:''; position:absolute; inset:0; border-radius:16px;
  background:linear-gradient(180deg, rgba(255,255,255,.15) 0%, transparent 50%);
  pointer-events:none;
}
.btn-gen:hover { transform:translateY(-3px); box-shadow:0 12px 36px rgba(236,72,153,.4), 0 4px 12px rgba(236,72,153,.2); }
.btn-gen:active { transform:translateY(0); }
.btn-gen:disabled { background:#d6d3d1; animation:none; cursor:not-allowed; box-shadow:0 2px 8px rgba(0,0,0,.06); transform:none; }
.btn-gen:disabled::after { display:none; }
@keyframes gradientShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }

.btn-sub {
  width:100%; padding:11px; border-radius:14px; font-size:13px; font-weight:600; letter-spacing:.06em;
  cursor:pointer; transition:all .3s;
  background:rgba(255,255,255,.55); border:1.5px solid rgba(0,0,0,.08); color:#57534e;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.btn-sub:hover { background:rgba(255,255,255,.85); border-color:rgba(0,0,0,.15); box-shadow:0 4px 12px rgba(0,0,0,.06); transform:translateY(-1px); }
.btn-sub:disabled { opacity:.35; cursor:not-allowed; transform:none; box-shadow:none; }

/* ============================================================
   右侧卡片区
   ============================================================ */
.cards-area { display:flex; flex-direction:column; gap:28px; flex-shrink:0; }
.card-section {
  display:flex; flex-direction:column; gap:10px;
  background:rgba(255,255,255,.35); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.5); border-radius:24px; padding:20px;
  box-shadow:0 4px 24px rgba(0,0,0,.06), inset 0 1px 0 rgba(255,255,255,.5);
}
.card-label {
  font-size:11px; font-weight:700; letter-spacing:.25em; color:#a8a29e; text-align:center;
  padding:4px 16px; width:fit-content; margin:0 auto;
  background:rgba(255,255,255,.4); border-radius:20px; border:1px solid rgba(255,255,255,.6);
}

/* ============================================================
   明信片卡片
   ============================================================ */
.postcard {
  position:relative; width:640px; height:430px; background-color:#fafaf7; overflow:hidden; border-radius:10px;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(128,128,128,.01) 4px, rgba(128,128,128,.01) 5px),
    radial-gradient(ellipse at 20% 25%, rgba(255,255,255,.5) 0%, transparent 60%);
  box-shadow:0 8px 36px rgba(0,0,0,.16), 0 2px 8px rgba(0,0,0,.06); transition:all .5s;
}
.postcard:hover { box-shadow:0 12px 48px rgba(0,0,0,.22), 0 4px 12px rgba(0,0,0,.08); transform:translateY(-1px); }
.postcard::before { content:''; position:absolute; inset:10px; border:2px solid rgba(160,160,160,.2); border-radius:7px; pointer-events:none; z-index:2; opacity:.5; }
.postcard::after { content:''; position:absolute; inset:0; pointer-events:none; z-index:0; border-radius:10px;
  background:radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.04) 100%);
}

/* 照片背景 */
.bg-front { position:absolute; inset:0; z-index:0; object-fit:cover; opacity:.35; border-radius:10px; pointer-events:none; }
.bg-back  { position:absolute; inset:0; z-index:0; object-fit:cover; opacity:.35; border-radius:10px; pointer-events:none; }

/* 内部层级 */
.card-layer { position:relative; z-index:3; }

/* 顶部装饰条 */
.ribbon { position:relative; z-index:3; width:82%; height:2px; margin:6px auto 3px;
  background:linear-gradient(90deg, transparent, #999 15%, #666 50%, #999 85%, transparent); opacity:.4; }
.divider { width:66%; height:1px; margin:0 auto;
  background:linear-gradient(90deg, transparent, #999 25%, #666 50%, #999 75%, transparent); opacity:.4; }

/* 邮戳 & 邮票 */
.postmark { width:66px; height:66px; border:2.5px solid #b45309; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:10px; letter-spacing:.12em; color:#b45309; opacity:.6;
  transform:rotate(-10deg); text-align:center; line-height:1.25; z-index:3; font-weight:700; }
.postmark::after { content:''; position:absolute; inset:4px; border:1.5px dashed #b45309; border-radius:50%; opacity:.4; }
.stamp-area { width:52px; height:58px; border:1.5px dashed #b45309; z-index:2;
  display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.3); position:relative; overflow:hidden; }

/* 印章 */
.class-stamp { display:inline-block; color:#b45309; border:2.5px solid #b45309;
  padding:6px 18px; font-weight:700; letter-spacing:.28em; opacity:.82; border-radius:5px;
  text-shadow:1px 1px 0 rgba(255,255,255,.5); background:rgba(255,255,255,.2); }

/* 背面书写线 */
.write-line { width:82%; height:1px; background:#333; opacity:.22; margin:0 auto; }

/* SVG 签名 */
.signature-svg { width:100%; height:150px; z-index:3; position:relative; }
.signature-path { fill:#1a1a1a; stroke:none; }

/* ============================================================
   响应式
   ============================================================ */
@media (max-width:1300px) {
  .main-layout { flex-direction:column; align-items:center; }
  .control { width:100%; max-width:500px; }
  .cards-area { flex-direction:row; flex-wrap:wrap; justify-content:center; }
}
@media (max-width:700px) {
  .postcard { width:100%; aspect-ratio:640/430; height:auto; }
  .cards-area { flex-direction:column; align-items:center; }
}
@media print {
  @page { size:landscape; margin:0; }
  body { background:white !important; display:flex !important; align-items:center !important; justify-content:center !important;
    min-height:100vh !important; -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  body::before { display:none !important; }
  .no-print { display:none !important; }
  .main-layout { flex-direction:column !important; align-items:center !important; gap:0 !important; }
  .cards-area { flex-direction:row !important; gap:12px !important; }
  .card-label { display:none !important; }
  .postcard { box-shadow:none !important; border-radius:0 !important; width:48vw !important; height:auto !important; aspect-ratio:640/430 !important; max-width:none !important; }
}
</style>
</head>
<body class="flex items-center justify-center p-8 md:p-12">

<div class="main-layout flex gap-8 items-start justify-center relative z-10">

  <!-- ==================== 左侧控制台 ==================== -->
  <div class="control no-print">
    <div class="control-title">🎴 签名明信片</div>
    <div class="control-subtitle">博雅未来高中 · 专属定制</div>
    <div class="control-divider"></div>

    <div>
      <div class="control-label">你的名字</div>
      <input id="nameInput" class="control-input" placeholder="例如：林星河" maxlength="10" autocomplete="off">
      <div class="control-hint">已输入 <span id="charCount">0</span> 字符 · 最多4汉字 / 10字母</div>

    <div class="flex flex-col gap-3">
      <button id="btnGenerate" class="btn-gen">🎲 随机生成签名</button>

              <span class="text-sm font-extrabold tracking-widest block" style="color:#333;opacity:.8;">博雅未来高中</span>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="images.js"></script>
<script>
(function() {
  var $ = function(id) { return document.getElementById(id); };

  var FONTS = [
    { family:'Ma Shan Zheng', name:'马山正' }, { family:'Liu Jian Mao Cao', name:'柳建毛草' },
    { family:'ZCOOL KuaiLe', name:'站酷快乐' }, { family:'ZCOOL QingKe HuangYou', name:'站酷黄油' },
    { family:'Zhi Mang Xing', name:'志莽行书' }, { family:'Long Cang', name:'龙藏体' },
    { family:'Noto Serif SC', name:'思源宋体' },
  ];
  var QUOTES = ['天道酬勤','千里之行','学而不厌','志存高远','自强不息','厚德载物','博学笃行','温故知新'];
  var NAMES = ['林星河','苏月华','陈逸飞','赵清欢','周子墨','吴雨桐','郑书瑶','王浩然','李若溪','张明远','刘思源','杨雪晴','唐子涵','柳如烟','沈青禾'];

  var postcard = $('postcard'), postcardBack = $('postcardBack');
  var campusFront = $('campusBgFront'), campusBack = $('campusBgBack');
  var sigSvg = $('signatureSvg'), quoteSvg = $('quoteSvg');
  var nameInput = $('nameInput'), charCount = $('charCount');
  var btnGen = $('btnGenerate'), btnDl = $('btnDownload'), btnPr = $('btnPrint');
  var statusMsg = $('statusMsg');
  var hasWritten = false;

  // 图片初始化
  $('emblemImg').src = IMG_EMBLEM; $('stampEmblem').src = IMG_EMBLEM; $('backEmblem').src = IMG_EMBLEM;
  campusFront.src = IMG_CAMPUS1; campusBack.src = IMG_CAMPUS2;

  function pick(a) { return a[Math.floor(Math.random()*a.length)]; }

  nameInput.addEventListener('input', function() {
    var t = nameInput.value.trim(), cn = (t.match(/[一-鿿㐀-䶿]/g)||[]).length, en = (t.match(/[a-zA-Z]/g)||[]).length;
    charCount.textContent = cn+en;
  });

  async function loadFont(f) { await document.fonts.load('16px '+f,'测'); }

  function trace(family, text, sw, sh, opt) {
    opt = opt||{}; var ns='http://www.w3.org/2000/svg', paths=[];
    var t = (text.match(/[一-鿿㐀-䶿]/g)||[]).length+(text.match(/[a-zA-Z]/g)||[]).length;
    var fs = opt.fontSize||([140,118,96,96,76,60][Math.min(t,5)]||60);
    var ink = opt.color||'#1a1a1a';
    var sc=5, cw=sw*sc, ch=sh*sc, cfs=fs*sc;
    var cv = document.createElement('canvas'); cv.width=cw; cv.height=ch;
    var ctx = cv.getContext('2d');
    ctx.font = cfs+'px "'+family+'"'; ctx.fillStyle='#000'; ctx.textBaseline='alphabetic';
    var tw = ctx.measureText(text).width;
    ctx.fillText(text,(cw-tw)/2,ch/2+cfs*.32);
    var px = ctx.getImageData(0,0,cw,ch).data;
    for (var col=0; col<cw; col++) {
      var inS=false, st=0;
      for (var row=0; row<ch; row++) {
        var a = px[(row*cw+col)*4+3];
        if (a>80&&!inS) { inS=true; st=row; }
        else if (a<=80&&inS) { inS=false; var l=row-st; if (l>=2) {
          var x=col/sc, y=st/sc, w=1/sc, h=l/sc;
          var el=document.createElementNS(ns,'path');
          el.setAttribute('d','M'+x.toFixed(2)+' '+y.toFixed(2)+'h'+w.toFixed(2)+'v'+h.toFixed(2)+'h'+(-w).toFixed(2)+'Z');
          el.setAttribute('fill',ink); el.setAttribute('opacity',opt.opacity||'1'); el.classList.add('signature-path');
          paths.push(el);
        }}
      }
      if (inS) { var l=ch-st; if (l>=2) {
        var x=col/sc, y=st/sc, w=1/sc, h=l/sc;
        var el=document.createElementNS(ns,'path');
        el.setAttribute('d','M'+x.toFixed(2)+' '+y.toFixed(2)+'h'+w.toFixed(2)+'v'+h.toFixed(2)+'h'+(-w).toFixed(2)+'Z');
        el.setAttribute('fill',ink); el.setAttribute('opacity',opt.opacity||'1'); el.classList.add('signature-path');
        paths.push(el);
      }}
    }
    if (!paths.length) throw new Error('未提取到笔画');
    return paths;
  }

  function bindUI(ok) { btnGen.disabled=!ok; btnDl.disabled=!ok; btnPr.disabled=!ok; }

  async function generate() {
    if (btnGen.disabled) return;
    var text = nameInput.value.trim();
    if (!text) { text=pick(NAMES); nameInput.value=text; charCount.textContent=text.length; }
    var cn=(text.match(/[一-鿿㐀-䶿]/g)||[]).length, en=(text.match(/[a-zA-Z]/g)||[]).length;
    if (cn>4||en>10) { statusMsg.textContent='⚠️ 汉字≤4 / 字母≤10'; statusMsg.style.color='#ef4444'; return; }

    var font=pick(FONTS);
    campusFront.src=pick([IMG_CAMPUS1,IMG_CAMPUS2]); campusFront.style.display='block';
    campusBack.src=pick([IMG_CAMPUS1,IMG_CAMPUS2]); campusBack.style.display='block';

    try {
      sigSvg.innerHTML=''; quoteSvg.innerHTML='';
      var ph=$('placeholderText'); if (ph) ph.remove();
      statusMsg.textContent='📥 加载字体 '+font.name+'...'; statusMsg.style.color='#6b7280'; bindUI(false);
      await loadFont(font.family);
      statusMsg.textContent='🔧 生成笔画...';

      var np=trace(font.family,text,580,140);
      var ink='#1a1a1a';
      var qp=trace(font.family,pick(QUOTES),580,38,{fontSize:34,color:ink,opacity:'0.55'});

      np.forEach(function(p){sigSvg.appendChild(p);});
      qp.forEach(function(p){quoteSvg.appendChild(p);});

      hasWritten=true; bindUI(true);
      statusMsg.textContent='✅ 字体:'+font.family; statusMsg.style.color='#10b981';
    } catch(e) {
      console.error(e); statusMsg.textContent='❌ '+e.message; statusMsg.style.color='#ef4444';
      bindUI(true); quoteSvg.innerHTML='';
      if (!$('placeholderText')) {
        var el=document.createElementNS('http://www.w3.org/2000/svg','text');
        el.setAttribute('x','290'); el.setAttribute('y','72'); el.setAttribute('text-anchor','middle');
        el.setAttribute('fill','#1a1a1a'); el.setAttribute('opacity','.18'); el.setAttribute('id','placeholderText');
        el.textContent='你的签名将在此呈现'; sigSvg.appendChild(el);
      }
    }
  }

  async function download() {
    if (!hasWritten) return;
    statusMsg.textContent='📸 生成高清图片...'; statusMsg.style.color='#6b7280'; btnDl.disabled=true;
    await new Promise(function(r){setTimeout(r,300);});

    var c1=await html2canvas(postcard,{backgroundColor:'#fafaf7',scale:2.5,useCORS:false,allowTaint:false,logging:false});
    var c2=await html2canvas(postcardBack,{backgroundColor:'#fafaf7',scale:2.5,useCORS:false,allowTaint:false,logging:false});

    var name=nameInput.value.trim()||'未命名';
    var a1=document.createElement('a');
    a1.download='博雅未来_明信片正面_'+name+'.png';
    a1.href=c1.toDataURL('image/png',1.0); a1.click();

    var a2=document.createElement('a');
    a2.download='博雅未来_明信片背面_'+name+'.png';
    a2.href=c2.toDataURL('image/png',1.0); a2.click();

    statusMsg.textContent='✅ 已下载正面和背面两张图片！'; statusMsg.style.color='#10b981'; btnDl.disabled=false;
  }

  function print() { if (hasWritten) window.print(); }

  btnGen.addEventListener('click',generate);
  btnDl.addEventListener('click',download);
  btnPr.addEventListener('click',print);
  nameInput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();generate();}});
})();
</script>
</body>
</html>
